[project]
name = "large-supervisor-models"
version = "0.1.0"
description = "Large-Supervisor-Models"
authors = [ { name = "Praneeth Vadlapati", email = "praneeth.vad@gmail.com" } ]
readme = "README.md"
license = { text = "CC-BY 4.0" }
requires-python = ">=3.8"
dependencies = [
  "python-dotenv",
  "openai",
  "torch",
  "transformers",
]

[tool.setuptools.packages.find]
include = ["large_supervisor_models", "large_supervisor_models.*"]

[project.optional-dependencies]
dev = [
	"pytest>=6.0",
]
